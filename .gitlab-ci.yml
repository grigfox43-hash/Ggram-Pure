stages:
  - build
  - release

variables:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m' -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

build_app:
  stage: build
  image: mobiledevops/android-sdk-image:34.0.0-jdk17
  before_script:
    - chmod +x gradlew || true
    - yes | sdkmanager --licenses || true
    - sdkmanager "platforms;android-35" "build-tools;35.0.0" || true
    - |
      if [ ! -f "TMessagesProj/config/ggram_release.jks" ]; then
        echo "Generating release keystore..."
        keytool -genkeypair -v -keystore "TMessagesProj/config/ggram_release.jks" -storepass "ggram2026release" -alias "ggram" -keypass "ggram2026release" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Ggram, OU=Ggram Pure, O=Ggram, L=Dubai, ST=Dubai, C=AE" || true
      fi
    - |
      mkdir -p TMessagesProj/src/main/assets/model-ru
      if [ ! -f "TMessagesProj/src/main/assets/model-ru/uuid" ]; then
        echo "Downloading Vosk Russian Speech Model..."
        curl -sSL "https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip" -o vosk-model.zip
        unzip -q -o vosk-model.zip
        cp -r vosk-model-small-ru-0.22/* TMessagesProj/src/main/assets/model-ru/
        echo "vosk-ru-0.22" > TMessagesProj/src/main/assets/model-ru/uuid
        rm -rf vosk-model.zip vosk-model-small-ru-0.22
      fi
  script:
    - bash ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone --stacktrace
    - mkdir -p output_apk
    - TAG_NAME="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - find TMessagesProj_AppStandalone/build/outputs/apk -type f -name "*.apk" -exec cp {} output_apk/Ggram-Full-Telegram-${TAG_NAME}.apk \;
    - ls -lh output_apk/
  artifacts:
    name: "Ggram-APK-${CI_COMMIT_REF_NAME}"
    paths:
      - output_apk/*.apk
    expire_in: 4 weeks

release_job:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  allow_failure: true
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: build_app
      artifacts: true
  script:
    - echo "Publishing release for $CI_COMMIT_TAG on GitLab"
  release:
    name: "Ggram Pure Release $CI_COMMIT_TAG"
    description: "Release build of Ggram Pure $CI_COMMIT_TAG generated by GitLab CI"
    tag_name: "$CI_COMMIT_TAG"
    ref: "$CI_COMMIT_TAG"
    assets:
      links:
        - name: "Ggram-Full-Telegram-${CI_COMMIT_TAG}.apk"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/raw/output_apk/Ggram-Full-Telegram-${CI_COMMIT_TAG}.apk"
