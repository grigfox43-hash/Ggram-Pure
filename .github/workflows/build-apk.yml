name: Ggram Pure Full Telegram CI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build Full Telegram Ggram APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Full Telegram APK
        run: ./gradlew :TMessagesProj_AppStandalone:assembleAfatDebug --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p output_apk
          find TMessagesProj_AppStandalone/build/outputs/apk -type f -name "*.apk" -exec cp {} output_apk/Ggram-Full-Telegram-v1.0.0.apk \;
          ls -la output_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ggram-Full-Telegram-v1.0.0
          path: output_apk/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: output_apk/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
